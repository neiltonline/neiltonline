<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Copa do Mundo — Bracket Circular</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="./css/bracket.css" />
</head>
<body class="bracket-page">
  <header class="bracket-header">
    <a href="../index.html" class="bracket-logo">
      <img src="../imagens/logo.svg" alt="neiltonline" width="37" />
    </a>
    <nav class="bracket-nav">
      <a href="../index.html">Portfolio</a>
      <span class="bracket-nav__active">Bracket</span>
    </nav>
    <div class="bracket-meta">
      <span id="connection-status" class="status">Carregando…</span>
      <span class="bracket-meta__sep">·</span>
      <span>Atualizado <time id="last-update">—</time></span>
    </div>
  </header>

  <main class="bracket-main">
    <aside class="bracket-sidebar">
      <h1 id="tournament-name" class="bracket-title">FIFA World Cup</h1>
      <p class="bracket-subtitle">Acompanhamento em tempo real da tabela eliminatória</p>

      <section class="bracket-live">
        <h2>
          <span class="live-dot"></span>
          Ao vivo
          <span id="live-count" class="badge">0</span>
        </h2>
        <ul id="live-list" class="live-list"></ul>
      </section>

      <section id="match-panel" class="match-panel" hidden>
        <button id="close-panel" class="match-panel__close" aria-label="Fechar">×</button>
        <p id="match-round" class="match-panel__round"></p>
        <p id="match-teams" class="match-panel__teams"></p>
        <p id="match-score" class="match-panel__score"></p>
        <p id="match-status" class="match-status"></p>
      </section>

      <section class="bracket-legend">
        <h2>Legenda</h2>
        <ul>
          <li><span class="legend-line legend-line--winner"></span> Caminho do vencedor</li>
          <li><span class="legend-line legend-line--live"></span> Jogo ao vivo</li>
          <li><span class="legend-line legend-line--out"></span> Eliminado</li>
        </ul>
      </section>
    </aside>

    <div class="bracket-canvas-wrap">
      <svg
        id="bracket-svg"
        viewBox="0 0 1000 1000"
        role="img"
        aria-label="Chave eliminatória circular da Copa do Mundo"
      ></svg>
    </div>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
